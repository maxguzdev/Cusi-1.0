<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./phaser.js"></script>
    <style>
        body { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #222; }
    </style>
    <title>Crossy Road</title>
</head>
<body>
<script>
    // ---------- NIVELES ----------
    // start/goal: posición del jugador y de la bandera
    // speed: velocidad de los autos | delay: frames entre autos (menos = más tráfico)
    // spawns: índices de `starts` (0-3 calles horizontales, 4-5 calle vertical)
    const ALL = [0, 1, 2, 3, 4, 5]
    const LEVELS = [
        { name: 'Calle tranquila',   start: { x: 170, y: 450 }, goal: { x: 628, y: 450 }, speed: 200, delay: 70, spawns: [0, 1, 2, 3],  grass: 0x00ff00 },
        { name: 'Sube un piso',      start: { x: 170, y: 450 }, goal: { x: 628, y: 250 }, speed: 230, delay: 60, spawns: ALL,           grass: 0x00ff00 },
        { name: 'Hasta arriba',      start: { x: 170, y: 450 }, goal: { x: 628, y: 50 },  speed: 250, delay: 55, spawns: ALL,           grass: 0x66ff33 },
        { name: 'De vuelta',         start: { x: 628, y: 450 }, goal: { x: 170, y: 50 },  speed: 270, delay: 50, spawns: ALL,           grass: 0x66ff33 },
        { name: 'Diagonal',          start: { x: 170, y: 50 },  goal: { x: 628, y: 450 }, speed: 290, delay: 45, spawns: ALL,           grass: 0xcccc33 },
        { name: 'Cruce medio',       start: { x: 170, y: 250 }, goal: { x: 628, y: 250 }, speed: 300, delay: 42, spawns: ALL,           grass: 0xcccc33 },
        { name: 'Hora pico',         start: { x: 628, y: 50 },  goal: { x: 170, y: 450 }, speed: 320, delay: 38, spawns: ALL,           grass: 0xff9933 },
        { name: 'Sin frenos',        start: { x: 170, y: 450 }, goal: { x: 628, y: 50 },  speed: 340, delay: 34, spawns: ALL,           grass: 0xff9933 },
        { name: 'Caos total',        start: { x: 628, y: 450 }, goal: { x: 170, y: 250 }, speed: 360, delay: 30, spawns: ALL,           grass: 0xff5533 },
        { name: 'Jefe final',        start: { x: 170, y: 50 },  goal: { x: 628, y: 450 }, speed: 380, delay: 26, spawns: ALL,           grass: 0xff3355 }
    ]
    const MAX_LIVES = 3

    // ---------- CONFIG ----------
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 500,
        physics: { default: 'arcade', arcade: { debug: false } },
        scene: { preload, create, update }
    }
    const game = new Phaser.Game(config)

    function preload() {
        this.load.image('flag', 'assets/flag.jpg')
        this.load.spritesheet('ironman', 'assets/ironman.png', { frameWidth: 32, frameHeight: 48 })
        this.load.spritesheet('car', 'assets/cars.png', { frameWidth: 76.8, frameHeight: 128 })
        this.load.spritesheet('car-horizontal', 'assets/cars-horizontal.png', { frameWidth: 128, frameHeight: 76.8 })
    }

    // ---------- ESTADO ----------
    const posLeft1 = { x: 0, y: 180 }, posLeft2 = { x: 0, y: 380 }
    const posRight1 = { x: 800, y: 120 }, posRight2 = { x: 800, y: 320 }
    const posTop = { x: 370, y: 0 }, posBottom = { x: 430, y: 500 }
    const starts = [posLeft1, posLeft2, posRight1, posRight2, posBottom, posTop]

    // dy = desplazamiento vertical de cada intersección
    const INTERS = [
        { x: 340, y: 90, w: 120, h: 120, dy: 0 },
        { x: 340, y: 290, w: 120, h: 120, dy: 200 }
    ]
    // [dirección, eje, umbral, clave, ¿ya giró?, opciones de giro]
    const RULES = [
        [40, 'y', 120, 'B', false, ['left', 'down']],
        [40, 'y', 175, 'B', true,  ['right', 'down']],
        [38, 'y', 178, 'A', false, ['right', 'up']],
        [38, 'y', 123, 'A', true,  ['left', 'up']],
        [39, 'x', 365, 'C', false, ['down', 'right']],
        [39, 'x', 425, 'C', true,  ['up', 'right']],
        [37, 'x', 428, 'D', false, ['left', 'up']],
        [37, 'x', 368, 'D', true,  ['down', 'left']]
    ]
    const WINDOW = 8 // px de tolerancia (antes 2: los autos rápidos "saltaban" el giro)

    let level = 0, lives = MAX_LIVES
    let cars, spritesCar, fenceGroup, destRect, player, cursors, enterKey, hudText
    let standKey, carSpeed, gameOver, endState, cpt

    class Car {
        constructor(x, y, scene) {
            this.sprite = spritesCar.create(x, y)
            this.sprite.setScale(0.4)
            this.sprite.setImmovable()
            this.sprite.setBounce(1)
            this.color = Phaser.Math.Between(0, 4)
            this.flags = {}
            scene.physics.add.existing(this.sprite, true)
        }

        isInIntersection(i) {
            const s = this.sprite
            return i.x < s.x + s.width && i.x + i.w > s.x && i.y < s.y + s.height && i.y + i.h > s.y
        }

        getDirection() {
            const v = this.sprite.body.velocity
            if (v.x < 0) return 37
            if (v.y < 0) return 38
            if (v.x > 0) return 39
            if (v.y > 0) return 40
        }

        handleIntersectionDirection() {
            INTERS.forEach((it, n) => {
                if (!this.isInIntersection(it)) return
                for (const [dir, axis, lo, key, need, opts] of RULES) {
                    if (this.getDirection() !== dir) continue
                    const v = this.sprite[axis], t = lo + (axis === 'y' ? it.dy : 0)
                    if (v > t && v < t + WINDOW && !!this.flags[n + key] === need) {
                        this.flags[n + key] = !need
                        goto(this.sprite, opts, this.color)
                    }
                }
            })
        }
    }

    // ---------- ESCENA ----------
    function create() {
        const L = LEVELS[level]
        cars = []; cpt = 0; gameOver = false; endState = null
        standKey = 'stand-down'; carSpeed = L.speed

        spritesCar = this.physics.add.group()
        drawMap(this, L)

        ;['yellow', 'blue', 'red', 'green', 'purple'].forEach((c, i) => {
            createSpriteCar(c, 'car', i)
            createSpriteCar(c + '-hz', 'car-horizontal', i)
        })

        player = this.physics.add.sprite(L.start.x, L.start.y, 'ironman')
        player.setScale(0.5)
        player.setCollideWorldBounds(true)

        animateSpritePlayer('down', 1, 3)
        animateSpritePlayer('left', 5, 7)
        animateSpritePlayer('right', 9, 11)
        animateSpritePlayer('up', 13, 16)
        standSpritePlayer('stand-down', 0)
        standSpritePlayer('stand-left', 4)
        standSpritePlayer('stand-right', 8)
        standSpritePlayer('stand-up', 12)

        cursors = this.input.keyboard.createCursorKeys()
        enterKey = this.input.keyboard.addKey('ENTER')

        this.physics.add.collider(player, spritesCar, carHitPlayer, null, this)
        this.physics.add.collider(fenceGroup, player)
        this.physics.add.collider(destRect, player, playerWin, null, this)

        // HUD y banner del nivel
        hudText = this.add.text(8, 6, '', { font: 'bold 18px Arial', color: '#fff', stroke: '#000', strokeThickness: 4 }).setDepth(10)
        updateHud()
        const banner = this.add.text(400, 250, `Nivel ${level + 1}\n${L.name}`, {
            font: 'bold 48px Arial', color: '#fff', stroke: '#000', strokeThickness: 6, align: 'center'
        }).setOrigin(0.5).setDepth(10)
        this.tweens.add({ targets: banner, alpha: 0, delay: 1200, duration: 700 })
    }

    function update() {
        if (gameOver) {
            if (Phaser.Input.Keyboard.JustDown(enterKey)) nextStep(this)
            return
        }
        const L = LEVELS[level]

        if (cpt % L.delay === 0) {
            const pos = starts[L.spawns[Phaser.Math.Between(0, L.spawns.length - 1)]]
            const car = new Car(pos.x, pos.y, this)
            cars.push(car)
            carDirection(car.sprite, getDirectionValue(pos), car.color)
        }

        // giros en intersecciones + limpieza de autos fuera de pantalla
        for (let i = cars.length - 1; i >= 0; i--) {
            const s = cars[i].sprite
            if (s.x < -150 || s.x > 950 || s.y < -150 || s.y > 650) {
                s.destroy()
                cars.splice(i, 1)
            } else {
                cars[i].handleIntersectionDirection()
            }
        }

        // movimiento del jugador
        if (cursors.up.isDown) move('up', 0, -160)
        else if (cursors.down.isDown) move('down', 0, 160)
        else if (cursors.left.isDown) move('left', -160, 0)
        else if (cursors.right.isDown) move('right', 160, 0)
        else {
            player.setVelocity(0, 0)
            player.anims.play(standKey)
        }
        cpt++
    }

    function move(dir, vx, vy) {
        player.anims.play(dir, true)
        standKey = 'stand-' + dir
        player.setVelocity(vx, vy)
    }

    // ---------- FLUJO DEL JUEGO ----------
    function updateHud() {
        hudText.setText(`Nivel ${level + 1}/${LEVELS.length}   ${'♥'.repeat(lives)}${'♡'.repeat(MAX_LIVES - lives)}`)
    }

    function nextStep(scene) {
        if (endState === 'win') {
            level++
        } else if (endState === 'final' || endState === 'over') {
            level = 0; lives = MAX_LIVES
        }
        scene.scene.restart()
    }

    function carHitPlayer(pl, car) {
        if (gameOver) return
        if (car.body.touching.right && car.body.velocity.x > 0) endGame(this, 'left-side')
        else if (car.body.touching.left && car.body.velocity.x < 0) endGame(this, 'right-side')
        else if (car.body.touching.up && car.body.velocity.y < 0) endGame(this, 'bottom-side')
        else if (car.body.touching.down && car.body.velocity.y > 0) endGame(this, 'top-side')
    }

    function endGame(scene, hitSide) {
        scene.physics.pause()
        gameOver = true
        lives--
        endState = lives > 0 ? 'retry' : 'over'
        player.anims.stop()
        player.setTint(0xff0000)
        handleHitSide(hitSide)
        updateHud()
        displayEndMessage(scene, lives > 0 ? '¡Atropellado!' : 'Game Over',
            lives > 0 ? `Te quedan ${lives} vidas · ENTER para reintentar` : 'ENTER para volver al nivel 1')
    }

    function playerWin() {
        if (gameOver) return
        this.physics.pause()
        gameOver = true
        player.anims.stop()
        const last = level === LEVELS.length - 1
        endState = last ? 'final' : 'win'
        displayEndMessage(this, last ? '¡GANASTE EL JUEGO!' : '¡Nivel completado!',
            last ? 'ENTER para jugar de nuevo' : 'ENTER para el siguiente nivel')
    }

    function handleHitSide(hitSide) {
        const t = {
            'left-side': [-90, 10, 0], 'right-side': [90, -10, 0],
            'top-side': [180, 0, 10], 'bottom-side': [-180, 0, -10]
        }[hitSide]
        player.angle = t[0]; player.x += t[1]; player.y += t[2]
    }

    function displayEndMessage(scene, msg, sub) {
        scene.add.rectangle(0, 0, 800, 500, 0x000000, 0.55).setOrigin(0, 0).setDepth(20)
        scene.add.text(400, 220, msg, { font: 'bold 60px Arial' }).setOrigin(0.5).setDepth(21)
            .setTint(0xff00ff, 0xffff00, 0x0000ff, 0xff0000)
        scene.add.text(400, 290, sub, { font: '24px Arial', color: '#fff' }).setOrigin(0.5).setDepth(21)
    }

    // ---------- AUTOS ----------
    function getDirectionValue(pos) {
        if (pos.x == 0) return 39
        if (pos.x == 800) return 37
        if (pos.y == 0) return 40
        if (pos.y == 500) return 38
    }

    function goto(sprite, directions, color) {
        const d = directions[Phaser.Math.Between(0, 1)]
        carDirection(sprite, { left: 37, up: 38, right: 39, down: 40 }[d], color)
    }

    function carDirection(sprite, direction, color) {
        const horizontal = direction === 37 || direction === 39
        sprite.setTexture(horizontal ? 'car-horizontal' : 'car')
        sprite.flipX = direction === 39
        sprite.flipY = direction === 37 || direction === 40
        sprite.body.setSize(sprite.frame.width, sprite.frame.height, false)
        sprite.setVelocityX(direction === 37 ? -carSpeed : direction === 39 ? carSpeed : 0)
        sprite.setVelocityY(direction === 38 ? -carSpeed : direction === 40 ? carSpeed : 0)
        sprite.anims.play(getCarColor(horizontal ? 9 - color : color))
    }

    function getCarColor(val) {
        return ['yellow', 'blue', 'red', 'green', 'purple',
                'yellow-hz', 'blue-hz', 'red-hz', 'green-hz', 'purple-hz'][val]
    }

    // ---------- ANIMACIONES (se crean una sola vez) ----------
    function animateSpritePlayer(k, s, e) {
        if (game.anims.exists(k)) return
        game.anims.create({ key: k, frames: game.anims.generateFrameNumbers('ironman', { start: s, end: e }), frameRate: 10, repeat: -1 })
    }

    function createSpriteCar(k, fk, f) {
        if (game.anims.exists(k)) return
        game.anims.create({ key: k, frames: [{ key: fk, frame: f }], frameRate: 10 })
    }

    function standSpritePlayer(k, frame) {
        if (game.anims.exists(k)) return
        game.anims.create({ key: k, frames: [{ key: 'ironman', frame }], frameRate: 10 })
    }

    // ---------- MAPA ----------
    function drawMap(scene, L) {
        const rect = (x, y, w, h, c, a = 1) => scene.add.rectangle(x, y, w, h, c, a).setOrigin(0, 0)

        rect(0, 0, 800, 500, L.grass, 0.5)
        rect(350, 0, 100, 500, 0x000000)
        rect(0, 100, 800, 100, 0x000000)
        rect(0, 300, 800, 100, 0x000000)

        // pasos de cebra
        for (let i = 355; i < 455; i += 10) rect(i, 25, 3, 50, 0xfff200)
        for (let i = 150; i < 800; i += 450) {
            for (let j = 310; j < 400; j += 10) rect(i, j, 50, 3, 0xfff200)
            for (let j = 110; j < 200; j += 10) rect(i, j, 50, 3, 0xfff200)
        }

        // vallas
        fenceGroup = scene.physics.add.staticGroup()
        const fence = (x, y, w, h) => fenceGroup.add(rect(x, y, w, h, 0x27ae60))
        for (const i of [0, 200, 450, 650])
            for (let j = 100; j < 500; j += 100) fence(i, j, 150, 2)
        for (let i = 350; i <= 450; i += 100) {
            for (let j = 200; j < 500; j += 200) fence(i, j, 2, 100)
            for (let j = 0; j <= 100; j += 75) fence(i, j, 2, 25)
        }

        // meta
        destRect = scene.add.image(L.goal.x, L.goal.y, 'flag')
        destRect.setScale(0.4, 0.15)
        scene.physics.add.existing(destRect)
        destRect.body.setImmovable()
    }
</script>
</body>
</html>
