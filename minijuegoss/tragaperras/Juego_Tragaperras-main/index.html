<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Tragaperras</title>
    <link rel="icon" href="../assets/img/favicon.png">
    <link rel="stylesheet" href="assets/css/stylesheet.css">
</head>
<body>
    <div class="cusimios-hud">
        <img src="/Cusi-1.0/frontEnd/Cusi_style/cusimios.png" class="icono-moneda-hud">
    </div>
    <div class="container">
        <button class="button" data-text="Awesome">
            <span class="actual-text">&nbsp;Tragaperras&nbsp;</span>
            <span aria-hidden="true" class="hover-text">&nbsp;Tragaperras&nbsp;</span>
        </button>
        <div id="tragaperras">
            <div class="slot" id="slot1"><img src="./assets/img/fresa.png"></div>
            <div class="slot" id="slot2"><img src="./assets/img/naranja.png"></div>
            <div class="slot" id="slot3"><img src="./assets/img/uvas.png"></div>
        </div>
        <button id="botonTirar" onclick="tirar()">Tirada</button>
        <button id="insertarMoneda" onclick="insertarMonedas()">Insertar moneda</button>
        <p id="creditos">Créditos: <span id="cuentaCreditos"></span></p>     
        <p id="mensaje"></p>
        <video muted autoplay loop class="videoback">
        <source src="assets/img/video/Silent_Agent_Project_V1.mp4">
    </video>
    
   <img src="assets/img/celular.png" class="celular" >

   <div class="celularvid">
 <video muted autoplay loop class="videocel">
        <source src="assets/img/video/videocel.mp4">
        </video>
        </div>
  
    <div id="capa"></div>
    </div>         
    <script src="./assets/javascript/script.js"></script>
  </body>
</html>
