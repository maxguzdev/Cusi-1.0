<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/Cusi-1.0/frontEnd/Cusi_style/favicon_cusi.png" type="image/png">
    <title>Cusi Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #18122B;
            color: #E0AAFF;
            font-family: "Trebuchet MS", Verdana, sans-serif;
        }
        h1 {
            margin: 0 0 16px;
            font-size: 2.2rem;
            letter-spacing: 1px;
            color: #C77DFF;
            text-shadow: 0 2px 8px rgba(199, 125, 255, 0.4);
        }
        canvas {
            max-width: 92vw;
            height: auto;
            border: 6px solid #5A189A;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(90, 24, 154, 0.5);
            background: #240046;
        }
        p {
            margin: 14px 0 0;
            font-size: 0.95rem;
            color: #E0AAFF;
        }
        .btn-volver {
            margin-top: 15px;
            padding: 8px 16px;
            background: #7B2CBF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            text-decoration: none;
        }
        .btn-volver:hover {
            background: #9D4EDD;
        }
    </style>
</head>
<body>
    <h1>Cusi Snake</h1>
    <canvas id="game" width="400" height="400"></canvas>
    <p>Flechas o WASD para moverte</p>
    <a href="../../index.html" class="btn-volver">Volver al inicio</a>
    <script src="index.js"></script>
</body>
</html>
