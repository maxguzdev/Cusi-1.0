<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cusi Roulette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Cusi Roulette</h1>
  </header>

  <div id="hud">
    <span id="bankDisplay">Dinero: $0</span>
    <span id="betDisplay">Apostado: $0</span>
  </div>

  <main>
    <section id="tableCol">
      <div id="chipContainer">
        <button class="chip" data-value="5">5</button>
        <button class="chip" data-value="10">10</button>
        <button class="chip" data-value="20">20</button>
        <button class="chip" data-value="50">50</button>
        <button class="chip" data-value="100">100</button>
      </div>

      <div id="bettingBoard"></div>

      <div class="betArea" id="colorBetArea">
        <div class="betOption red" data-value="red">Rojo</div>
        <div class="betOption black" data-value="black">Negro</div>
      </div>
      <div class="betArea" id="evenoddBetArea">
        <div class="betOption" data-value="odd">Impar</div>
        <div class="betOption" data-value="even">Par</div>
      </div>
    </section>

    <section id="wheelCol">
      <div id="wheelContainer"><canvas id="wheelCanvas" width="400" height="400"></canvas></div>
      <div id="resultDisplay">Elige una ficha y haz tus apuestas.</div>
      <div class="actions">
        <button id="spinButton">Girar</button>
        <button id="clearButton" class="ghost">Quitar apuestas</button>
      </div>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
