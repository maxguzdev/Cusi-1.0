<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
 * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

form {
    width: 300px;
    height: 467px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #b8aec9;
    box-shadow: 0px 4px 10px 10px #8e5ce9;
    border-radius: 20px;
}

img {
    width: 154px;
    height: 154px;
    padding: 10px;
}

input[type="text"],
input[type="password"] {
    border: 1px solid #ccc;
    width: 80%;
    padding: 10px;
}

label {
    font-weight: 500;
    padding: 10px;
}

.box {
    width: 100%;
    height: auto;
    display: flex;
    justify-content: center;
    align-items: center;
}

button {
    outline: 0;
    border: 0;
    background-color: royalblue;
    border-radius: 20px;
    cursor: pointer;
    width: 250px;
    padding: 5px;
    transition: all 0.3s ease-in-out;
    text-align: center;
    color: white;
    font-weight: 500;
}

button:hover {
    opacity: 0.75;
}
  </style>
  <body>
    <form>
      <img src="Cusi_style/logo.png" />
      <label for="UserName">usuario</label>
      <input type="text" id="UserName" placeholder="ejemplo" required />
      <label for="password">usuario</label>
      <input type="password" id="password" placeholder="contraseña" required />
      <div class="box">
        <input type="checkbox" id="visible" />
        <label for="visible"> mostrar contraseña</label>
      </div>
      <button type="submit" id="submit">iniciar sesion</button>
    </form>
  </body>
</html>
